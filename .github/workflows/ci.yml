name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bizpilot_test
          POSTGRES_PASSWORD: bizpilot_test_password
          POSTGRES_DB: bizpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bizpilot_test -d bizpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database; tests/db_guard.py only accepts local hosts.
      TEST_DATABASE_URL: postgresql://bizpilot_test:bizpilot_test_password@localhost:5432/bizpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[test]"
      - name: Apply migrations to the test database
        run: alembic upgrade head
        env:
          BIZPILOT_DATABASE__URL: ${{ env.TEST_DATABASE_URL }}
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t bizpilot-api:ci .
      - name: Build web image
        run: docker build -t bizpilot-web:ci --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid apps/web
