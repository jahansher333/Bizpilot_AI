[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bizpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "fastapi>=0.135,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "argon2-cffi>=23.1.0,<24",
  "email-validator>=2.0,<3",
  "pyjwt>=2.15.1,<3",
  "uvicorn[standard]>=0.30,<1",
  # AI assistant (app/modules/ai). openai-agents is pre-1.0: pinned to the version the tests run on.
  "openai>=2.14,<3",
  "openai-agents==0.0.6",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<1", "pytest-asyncio>=1.3,<2"]

[tool.setuptools.packages.find]
include = ["app*"]